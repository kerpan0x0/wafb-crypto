name: WAFB CI + Deploy
on:
  push:
    branches: [ develop, main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ develop, main ]

env:
  NODE_VERSION: '20'
  AWS_REGION: 'eu-west-1'

jobs:
  quality:
    runs-on: ubuntu-22.04
    container:
      image: node:20-bookworm
    steps:
      - uses: actions/checkout@v4
      
      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@latest --activate
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Lint
        run: pnpm lint
      
      - name: Test
        run: pnpm test
      
      - name: Build
        run: pnpm build
      
      # Salva l'artifact per i job successivi
      - name: Upload build artifact
        if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v3        
        with:
          name: web-build
          path: packages/web/dist/
          retention-days: 1

  deploy-dev:
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-22.04
    container:
      image: node:20-bookworm
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Download build artifact
        uses: actions/download-artifact@v3
        with:
          name: web-build
          path: packages/web/dist/
      
      - name: Install AWS CLI
        run: |
          apt-get update
          apt-get install -y awscli
      
      - name: Configure AWS credentials
        run: |
          mkdir -p ~/.aws
          cat > ~/.aws/credentials <<EOF
          [default]
          aws_access_key_id = ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key = ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          EOF
          cat > ~/.aws/config <<EOF
          [default]
          region = ${{ env.AWS_REGION }}
          output = json
          EOF
      
      - name: Sync to S3 DEV
        run: |
          # Assets con cache lungo
          aws s3 sync ./packages/web/dist/assets/ s3://${{ secrets.S3_BUCKET_DEV }}/assets/ \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --metadata-directive REPLACE

          # Altri file
          aws s3 sync ./packages/web/dist/ s3://${{ secrets.S3_BUCKET_DEV }}/ \
            --exclude "assets/*" \
            --exclude "*.html" \
            --delete \
            --cache-control "public,max-age=3600" \
            --metadata-directive REPLACE

          # HTML senza cache
          aws s3 sync ./packages/web/dist/ s3://${{ secrets.S3_BUCKET_DEV }}/ \
            --exclude "*" \
            --include "*.html" \
            --delete \
            --cache-control "no-cache,no-store,must-revalidate" \
            --metadata-directive REPLACE
      
      - name: Invalidate CloudFront DEV
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID_DEV }} \
            --paths "/*"
      
      - name: Deploy Summary
        run: |
          echo "🚀 Deploy to DEV completed!"
          echo "📦 Bucket: ${{ secrets.S3_BUCKET_DEV }}"
          echo "https://d3o52vzag5art.cloudfront.net"

  release:
    needs: quality
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      packages: write
    runs-on: ubuntu-22.04
    container:
      image: node:20-bookworm
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@latest --activate

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync Versions
        run: |
          CLEAN_VERSION=${GITHUB_REF_NAME#v}
          NEW_VERSION=$CLEAN_VERSION pnpm version:sync

      - name: Build Project
        run: pnpm build

      - name: Archive Web Bundle
        run: |
          cp packages/web/nginx.conf packages/web/dist/ || true
          cd packages/web/dist
          tar -czf ../../../wafb-web-static.tar.gz .
          cd ../../..

      - name: Create and Upload Release Asset
        run: |
          echo "Creazione/Recupero Release..."
          curl -s -X POST -H "Authorization: token ${{ secrets.RELEASE_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"${{ github.ref_name }}\",\"title\":\"Release ${{ github.ref_name }}\",\"draft\":false,\"prerelease\":false}" \
            "${{ github.api_url }}/repos/${{ github.repository }}/releases" > release_info.json || true
          
          RELEASE_ID=$(curl -s -H "Authorization: token ${{ secrets.RELEASE_TOKEN }}" \
            "${{ github.api_url }}/repos/${{ github.repository }}/releases/tags/${{ github.ref_name }}" | \
            grep -oP '"id":\s*\K\d+' | head -n 1)
          
          echo "Release ID trovato: $RELEASE_ID"

          if [ -z "$RELEASE_ID" ]; then
            echo "❌ Impossibile recuperare il Release ID"
            exit 1
          fi

          echo "Caricamento asset su ID $RELEASE_ID..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: token ${{ secrets.RELEASE_TOKEN }}" \
            -H "Content-Type: application/gzip" \
            --data-binary "@./wafb-web-static.tar.gz" \
            "${{ github.api_url }}/repos/${{ github.repository }}/releases/${RELEASE_ID}/assets?name=wafb-web-static.tar.gz")

          if [ "$HTTP_CODE" -eq 201 ]; then
            echo "✅ Upload completato con successo!"
          else
            echo "❌ Errore durante l'upload. Codice HTTP: $HTTP_CODE"
            exit 1
          fi