name: WAFB CI
on:
  push:
    branches: [ develop, main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ develop, main ]

jobs:
  quality:
    runs-on: ubuntu-22.04
    container:
      image: node:20-bookworm
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@latest --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build

  release:
    needs: quality
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    container:
      image: node:20-bookworm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@latest --activate

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync Versions
        run: |
          CLEAN_VERSION=${GITHUB_REF_NAME#v}
          NEW_VERSION=$CLEAN_VERSION pnpm version:sync

      - name: Build Project
        run: pnpm build

      - name: Archive Web Bundle
        run: |
          cd $GITHUB_WORKSPACE/packages/web
          cp nginx.conf dist/
          cd dist
          tar -czvf $GITHUB_WORKSPACE/wafb-web-${{ github.ref_name }}.tar.gz .

      - name: Create and Upload Forgejo Release
        shell: bash
        run: |
          echo "Verifica/Creazione Release per il tag: ${{ github.ref_name }}"
          
          # 1. Creazione release (se non esiste)
          curl -s -X POST -H "Authorization: token ${{ secrets.RELEASE_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"${{ github.ref_name }}\",\"title\":\"Release ${{ github.ref_name }}\",\"draft\":false,\"prerelease\":true}" \
            "${{ github.api_url }}/repos/${{ github.repository }}/releases" > /dev/null || true

          # 2. Caricamento asset usando il TAG NAME nell'URL
          FILE_NAME="wafb-web-${{ github.ref_name }}.tar.gz"
          echo "Caricamento asset: $FILE_NAME"
          
          # Costruiamo l'URL di upload basato sull'API ufficiale di Forgejo per gli asset
          UPLOAD_URL="${{ github.api_url }}/repos/${{ github.repository }}/releases/tags/${{ github.ref_name }}/assets?name=${FILE_NAME}"
          
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: token ${{ secrets.RELEASE_TOKEN }}" \
            -H "Content-Type: application/gzip" \
            --data-binary "@./$FILE_NAME" \
            "$UPLOAD_URL")

          if [ "$HTTP_CODE" -eq 201 ]; then
            echo "✅ Rilascio completato con successo!"
          elif [ "$HTTP_CODE" -eq 404 ]; then
            echo "❌ Errore 404: L'endpoint di upload non è stato trovato. Provo metodo alternativo..."
            # Fallback estremo: caricamento tramite ID (che avevamo già, ma ricalcolato per sicurezza)
            RELEASE_ID=$(curl -s -H "Authorization: token ${{ secrets.RELEASE_TOKEN }}" "${{ github.api_url }}/repos/${{ github.repository }}/releases/tags/${{ github.ref_name }}" | sed -n 's/.*"id":\([0-9]*\),.*/\1/p' | head -n 1)
            curl -s -X POST -H "Authorization: token ${{ secrets.RELEASE_TOKEN }}" -H "Content-Type: application/gzip" --data-binary "@./$FILE_NAME" "${{ github.api_url }}/repos/${{ github.repository }}/releases/${RELEASE_ID}/assets"
            echo "✅ Tentativo di fallback inviato."
          else
            echo "❌ Errore HTTP: $HTTP_CODE"
            exit 1
          fi