name: WAFB CI
on:
  push:
    branches: [ develop, main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ develop, main ]

jobs:
  quality:
    runs-on: ubuntu-22.04
    container:
      image: node:20-bookworm
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@latest --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build

  release:
    needs: quality
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    container:
      image: node:20-bookworm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@latest --activate

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync Versions
        run: pnpm version:sync

      - name: Build Project
        run: pnpm build

      - name: Archive Web Bundle
        run: |
          cd packages/web/dist
          tar -czf ../../../wafb-web-${{ github.ref_name }}.tar.gz .

      - name: Upload to Forgejo Release
        uses: https://code.forgejo.org/forgejo/upload-release-asset@v1
        with:
          direction: upload
          base-url: ${{ github.api_url }}
          repository: ${{ github.repository }}
          release-id: ${{ github.ref_name }}
          image-path: ./wafb-web-${{ github.ref_name }}.tar.gz
          token: ${{ secrets.RELEASE_TOKEN  }}