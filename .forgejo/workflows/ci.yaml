name: WAFB CI
on:
  push:
    branches: [ develop, main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ develop, main ]

jobs:
  quality:
    runs-on: ubuntu-22.04
    container:
      image: node:20-bookworm
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@latest --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build

release:
    needs: quality
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      packages: write
    runs-on: ubuntu-22.04
    container:
      image: node:20-bookworm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@latest --activate

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync Versions
        run: |
          CLEAN_VERSION=${GITHUB_REF_NAME#v}
          NEW_VERSION=$CLEAN_VERSION pnpm version:sync

      - name: Build Project
        run: pnpm build

      - name: Archive Web Bundle
        run: |
          cp packages/web/nginx.conf packages/web/dist/
          cd packages/web/dist
          tar -czf ../../../wafb-web-static.tar.gz .
          cd ../../..

      - name: Upload to Forgejo Packages
        run: |
          curl -X PUT \
            -H "Authorization: token ${{ secrets.RELEASE_TOKEN }}" \
            --upload-file ./wafb-web-static.tar.gz \
            "${{ github.api_url }}/packages/${{ github.repository_owner }}/generic/wafb-web-static/${{ github.ref_name }}/wafb-web-static.tar.gz"
