name: WAFB CI
on:
  push:
    branches: [ develop, main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ develop, main ]

jobs:
  quality:
    runs-on: ubuntu-22.04
    container:
      image: node:20-bookworm
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@latest --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build

  release:
    needs: quality
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    container:
      image: node:20-bookworm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@latest --activate

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync Versions
        run: pnpm version:sync

      - name: Build Project
        run: pnpm build

      - name: Archive Web Bundle
        run: |
          cd packages/web/dist
          tar -czf ../../../wafb-web-${{ github.ref_name }}.tar.gz .

      - name: Upload Asset to Forgejo Release
        shell: bash
        run: |
          RELEASE_ID=$(curl -s -H "Authorization: token ${{ secrets.RELEASE_TOKEN }}" \
            "${{ github.api_url }}/repos/${{ github.repository }}/releases/tags/${{ github.ref_name }}" | jq -r .id)

          if [ "$RELEASE_ID" == "null" ]; then
            echo "Errore: Release non trovata per il tag ${{ github.ref_name }}"
            exit 1
          fi

          FILE_PATH="./wafb-web-${{ github.ref_name }}.tar.gz"
          
          curl -X POST \
            -H "Authorization: token ${{ secrets.RELEASE_TOKEN }}" \
            -H "Content-Type: application/gzip" \
            --data-binary "@$FILE_PATH" \
            "${{ github.api_url }}/repos/${{ github.repository }}/releases/${RELEASE_ID}/assets?name=$(basename $FILE_PATH)"