name: WAFB CI
on:
  push:
    branches: [ develop, main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ develop, main ]

jobs:
  quality:
    runs-on: ubuntu-22.04
    container:
      image: node:20-bookworm
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@latest --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build

  release:
    needs: quality
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    container:
      image: node:20-bookworm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@latest --activate

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync Versions
        run: |
          CLEAN_VERSION=${GITHUB_REF_NAME#v}
          NEW_VERSION=$CLEAN_VERSION pnpm version:sync

      - name: Build Project
        run: pnpm build

      - name: Archive Web Bundle
        run: |
          cd packages/web/dist
          tar -czf ../../../wafb-web-${{ github.ref_name }}.tar.gz .

      - name: Upload Asset to Forgejo Release
        shell: bash
        run: |
          echo "Recupero informazioni per il tag: ${{ github.ref_name }}"
          
          # 1. Tenta di recuperare la release. Usiamo -v per il debug in caso di errore 1
          RESPONSE=$(curl -s -H "Authorization: token ${{ secrets.RELEASE_TOKEN }}" \
            "${{ github.api_url }}/repos/${{ github.repository }}/releases/tags/${{ github.ref_name }}")
          
          # Debug: mostriamo cosa ha risposto Forgejo
          echo "Risposta API: $RESPONSE"

          # 2. Estrazione ID più robusta (cerca l'id numerico dopo la chiave "id")
          RELEASE_ID=$(echo "$RESPONSE" | grep -m 1 '"id":' | sed 's/[^0-9]//g')

          if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" == "" ]; then
            echo "ERRORE: Impossibile trovare l'ID della release."
            exit 1
          fi

          echo "Release ID trovato: $RELEASE_ID"

          # 3. Caricamento file
          FILE_NAME="wafb-web-${{ github.ref_name }}.tar.gz"
          echo "Caricamento file: $FILE_NAME"
          
          UPLOAD_URL="${{ github.api_url }}/repos/${{ github.repository }}/releases/${RELEASE_ID}/assets?name=${FILE_NAME}"
          
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: token ${{ secrets.RELEASE_TOKEN }}" \
            -H "Content-Type: application/gzip" \
            --data-binary "@./$FILE_NAME" \
            "$UPLOAD_URL")

          if [ "$HTTP_CODE" -ne 201 ]; then
            echo "ERRORE: Il caricamento è fallito con codice HTTP $HTTP_CODE"
            exit 1
          fi
          
          echo "Caricamento completato con successo!"