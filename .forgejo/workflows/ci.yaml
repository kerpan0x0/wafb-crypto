name: WAFB CI
on:
  push:
    branches: [ develop, main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ develop, main ]

jobs:
  quality:
    runs-on: ubuntu-22.04
    container:
      image: node:20-bookworm
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@latest --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build

  release:
    needs: quality
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      packages: write
    runs-on: ubuntu-22.04
    container:
      image: node:20-bookworm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@latest --activate

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync Versions
        run: |
          CLEAN_VERSION=${GITHUB_REF_NAME#v}
          NEW_VERSION=$CLEAN_VERSION pnpm version:sync

      - name: Build Project
        run: pnpm build

      - name: Archive Web Bundle
        run: |
          cp packages/web/nginx.conf packages/web/dist/
          cd packages/web/dist
          tar -czf ../../../wafb-web-static.tar.gz .
          cd ../../..

      - name: Create and Upload Release Asset
        run: |
          echo "Creazione/Recupero Release..."
          # Creiamo la release e salviamo l'intera risposta JSON in un file
          curl -s -X POST -H "Authorization: token ${{ secrets.RELEASE_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"${{ github.ref_name }}\",\"title\":\"Release ${{ github.ref_name }}\",\"draft\":false,\"prerelease\":false}" \
            "${{ github.api_url }}/repos/${{ github.repository }}/releases" > release_info.json || true
          
          # Se la release esisteva già, il POST sopra potrebbe aver dato errore. 
          # Recuperiamo l'ID in ogni caso (sia che sia nuova, sia che esistesse)
          RELEASE_ID=$(curl -s -H "Authorization: token ${{ secrets.RELEASE_TOKEN }}" \
            "${{ github.api_url }}/repos/${{ github.repository }}/releases/tags/${{ github.ref_name }}" | \
            grep -oP '"id":\s*\K\d+' | head -n 1)
          
          echo "Release ID trovato: $RELEASE_ID"

          if [ -z "$RELEASE_ID" ]; then
            echo "❌ Impossibile recuperare il Release ID"
            exit 1
          fi

          echo "Caricamento asset su ID $RELEASE_ID..."
          # Usiamo l'endpoint basato sull'ID, che è quello più primitivo e garantito
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: token ${{ secrets.RELEASE_TOKEN }}" \
            -H "Content-Type: application/gzip" \
            --data-binary "@./wafb-web-static.tar.gz" \
            "${{ github.api_url }}/repos/${{ github.repository }}/releases/${RELEASE_ID}/assets?name=wafb-web-static.tar.gz")

          if [ "$HTTP_CODE" -eq 201 ]; then
            echo "✅ Upload completato con successo!"
          else
            echo "❌ Errore durante l'upload. Codice HTTP: $HTTP_CODE"
            exit 1
          fi