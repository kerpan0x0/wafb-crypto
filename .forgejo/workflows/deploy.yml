name: Deploy to AWS (Dev)

on:
  push:
    branches:
      - develop
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  AWS_REGION: 'eu-west-1'

jobs:
  deploy-dev:
    name: Build and Deploy to Dev
    runs-on: ubuntu-22.04
    container:
      image: node:20-bookworm
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@latest --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core package
        run: pnpm build:core

      - name: Build web package
        run: pnpm build:web

      - name: Install AWS CLI
        run: |
          apt-get update
          apt-get install -y awscli

      - name: Configure AWS credentials
        run: |
          mkdir -p ~/.aws
          cat > ~/.aws/credentials <<EOF
          [default]
          aws_access_key_id = ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key = ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          EOF
          cat > ~/.aws/config <<EOF
          [default]
          region = ${{ env.AWS_REGION }}
          output = json
          EOF

      - name: Sync files to S3 (with cache headers)
        run: |
          aws s3 sync ./packages/web/dist/assets/ s3://${{ secrets.S3_BUCKET_DEV }}/assets/ \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --metadata-directive REPLACE

          aws s3 sync ./packages/web/dist/ s3://${{ secrets.S3_BUCKET_DEV }}/ \
            --exclude "assets/*" \
            --exclude "*.html" \
            --delete \
            --cache-control "public,max-age=3600" \
            --metadata-directive REPLACE

          aws s3 sync ./packages/web/dist/ s3://${{ secrets.S3_BUCKET_DEV }}/ \
            --exclude "*" \
            --include "*.html" \
            --delete \
            --cache-control "no-cache,no-store,must-revalidate" \
            --metadata-directive REPLACE

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID_DEV }} \
            --paths "/*"

      - name: Deploy Summary
        run: |
          echo "🚀 Deploy to DEV completed!"
          echo "📦 S3: ${{ secrets.S3_BUCKET_DEV }}"
          echo "🌐 https://d3o52vzag5art.cloudfront.net"